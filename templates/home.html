<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pads - Suas notas na nuvem</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-sizing: border-box;
        }
        h1 { color: #333; margin-top: 0; }
        p { color: #666; line-height: 1.5; }
        .input-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        
        /* Rodapé com link do GitHub */
        .github-link {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 14px;
        }
        .github-link a {
            color: #555;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
        }
        .github-link a:hover {
            color: #000;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pads</h1>
        <p>Um bloco de notas minimalista. Tudo o que você digita é salvo automaticamente e pode ser acessado de qualquer lugar.</p>
        <p><strong>Como usar:</strong> Digite o endereço na URL (ex: <em id="exemplo-url">...</em>) ou digite abaixo para criar ou acessar suas notas.</p>
        
        <div class="input-group">
            <input type="text" id="nomePagina" placeholder="Ex: ideias-geniais">
            <button onclick="acessarPagina()">Acessar</button>
        </div>

        <div class="github-link">
            <a href="https://github.com/VilanovaPassos/pads" target="_blank" rel="noopener noreferrer">
                <!-- Ícone do GitHub -->
                <svg height="18" width="18" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                </svg>
                Ver código no GitHub
            </a>
        </div>
    </div>

    <script>
        // Pega o domínio atual automaticamente (ex: localhost:8000 ou dominio.com.br)
        const hostAtual = window.location.host;
        document.getElementById('exemplo-url').innerText = hostAtual + '/projetos';

        function acessarPagina() {
            const nome = document.getElementById('nomePagina').value.trim();
            if (nome) {
                window.location.href = '/' + nome;
            }
        }

        document.getElementById('nomePagina').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') acessarPagina();
        });
    </script>
</body>
</html>
